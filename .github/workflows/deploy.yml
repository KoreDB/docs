name: Deploy to GitHub Pages

on:
  # Automatically deploy when pushing to main branch
  push:
    branches: [main]

  # Allow manual deployment trigger
  workflow_dispatch:

# Read repository contents while building the site
permissions:
  contents: read

# Ensure only one deployment runs at a time
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📁 Checkout repository
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "yarn"

      - name: 📦 Install dependencies
        run: yarn install

      - name: 🏗️ Build documentation site
        run: yarn run build
        env:
          REPO_NAME: ${{ github.event.repository.name }}
          REPO_OWNER: ${{ github.repository_owner }}
          # Disable telemetry data collection
          ASTRO_TELEMETRY_DISABLED: 1

      - name: 📋 Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./dist"

  # Deploy only after the artifact-producing job has completed. Retrying this
  # job reuses that artifact instead of uploading another with the same name.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment_retry.outputs.page_url || steps.deployment.outputs.page_url }}

    steps:
      - name: 📤 Setup GitHub Pages
        uses: actions/configure-pages@v4

      - name: 🚀 Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4

      # Artifact metadata can briefly be unavailable after a successful upload.
      # Retry deployment once, reusing the artifact, and propagate a second failure.
      - name: Wait before retrying deployment
        if: steps.deployment.outcome == 'failure'
        run: sleep 10

      - name: Retry GitHub Pages deployment
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
